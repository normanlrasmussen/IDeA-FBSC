<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102737" />
    <meta name="description" content="Explore college football recruiting geography, pathways, and program comparisons with Recruit Atlas." />
    <title>Recruit Atlas | College Football Recruiting Dashboard</title>
    <script>
      // Restore client-side routes rewritten by the GitHub Pages 404 redirect.
      (function (location) {
        if (location.search.slice(0, 2) !== "?/") return;
        var decoded = location.search.slice(1).replace(/~and~/g, "&");
        var separator = decoded.indexOf("&");
        var route = separator >= 0 ? decoded.slice(0, separator) : decoded;
        var query = separator >= 0 ? "?" + decoded.slice(separator + 1) : "";
        window.history.replaceState(null, "", location.pathname.replace(/\/$/, "") + route + query + location.hash);
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>Enable JavaScript to explore Recruit Atlas.</noscript>
    <div id="root"></div>
  </body>
</html>
